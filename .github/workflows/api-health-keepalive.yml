# Keep Render free-tier API warm + basic uptime signal.
name: API health keep-alive

on:
  schedule:
    # Free Render sleeps ~15m idle — ping more often than that.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake via Vercel proxy then direct
        env:
          PROXY_HEALTH: https://nur-web-orcin.vercel.app/health
          DIRECT_HEALTH: https://nur-api-ow0b.onrender.com/health
        run: |
          set -euo pipefail
          wake() {
            local url="$1"
            local label="$2"
            echo "=== $label $url ==="
            for attempt in 1 2 3 4 5; do
              echo "Attempt $attempt…"
              code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 90 "$url" || echo 000)
              echo "HTTP $code"
              cat /tmp/health.json || true
              echo
              if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/health.json && grep -q '"mongo":"up"' /tmp/health.json; then
                return 0
              fi
              sleep 12
            done
            return 1
          }
          wake "$PROXY_HEALTH" "proxy" || wake "$DIRECT_HEALTH" "direct" || {
            echo "Health check failed"
            exit 1
          }
