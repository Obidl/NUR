      name="description"
      content="Odatnoma — Qur'on, kitoblar, podkastlar va kunlik odatlar. Shovqinsiz, ishonchli."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Odatnoma</title>
    <script>
      /* Optional recovery only when ?reset=1 — never auto-reload (breaks Telegram). */
      (function () {
        try {
          var params = new URLSearchParams(location.search);
          if (params.get('reset') !== '1' || !('serviceWorker' in navigator)) return;
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }).then(function () {
            if (!('caches' in window)) return;
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            });
          }).then(function () {
            location.replace(location.pathname);
          }).catch(function () {
            location.replace(location.pathname);
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
